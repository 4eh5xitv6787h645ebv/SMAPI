name: Linux alpha release qualification

on:
    pull_request:
        branches:
            - develop
    workflow_dispatch:
        inputs:
            release_commit:
                description: Exact 40-character commit on develop to build
                required: true
                type: string
            release_version:
                description: Exact committed fork version
                required: true
                type: string
            release_tag:
                description: Reserved fork tag for this version (the tag may be created later)
                required: true
                type: string
    push:
        tags:
            - "fork-4eh5xitv6787h645ebv-linux-v*-alpha.*"

concurrency:
    group: linux-alpha-release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release_commit || github.sha }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    REFERENCE_ASSEMBLIES_COMMIT: 0141355fecb8536715ecff22f99374b5e632cbed

jobs:
    qualify-and-package:
        name: Linux alpha release qualification
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        outputs:
            release_commit: ${{ steps.release.outputs.release_commit }}
            release_tag: ${{ steps.release.outputs.release_tag }}
            release_version: ${{ steps.release.outputs.release_version }}
            source_tree: ${{ steps.release.outputs.source_tree }}
        steps:
            -   name: Checkout exact source commit
                uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
                with:
                    fetch-depth: 0
                    persist-credentials: false
                    ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}

            -   name: Validate exact commit and release identity
                id: release
                shell: bash
                env:
                    DISPATCH_COMMIT: ${{ inputs.release_commit }}
                    DISPATCH_TAG: ${{ inputs.release_tag }}
                    DISPATCH_VERSION: ${{ inputs.release_version }}
                run: |
                    set -euo pipefail
                    actual_commit="$(git rev-parse HEAD)"
                    source_tree="$(git show -s --format=%T HEAD)"
                    source_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' build/common.targets)"

                    if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                        [[ "$actual_commit" == "$DISPATCH_COMMIT" ]]
                        [[ "$source_version" == "$DISPATCH_VERSION" ]]
                        release_tag="$DISPATCH_TAG"
                    elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                        release_tag="$GITHUB_REF_NAME"
                    else
                        if [[ ! "$source_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-unofficial\.4eh5xitv6787h645ebv\.linux\.alpha\.([1-9][0-9]*)$ ]]; then
                            echo "The committed version isn't a valid Linux fork alpha: $source_version" >&2
                            exit 1
                        fi
                        release_tag="fork-4eh5xitv6787h645ebv-linux-v${BASH_REMATCH[1]}-alpha.${BASH_REMATCH[2]}"
                    fi

                    build/scripts/validate-linux-release-inputs.sh "$source_version" "$release_tag" "$actual_commit"

                    if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
                        git fetch --no-tags origin develop
                        git merge-base --is-ancestor "$actual_commit" origin/develop
                    fi
                    if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                        if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
                            echo "Release tags must be annotated tag objects; lightweight tags are refused." >&2
                            exit 1
                        fi
                        [[ "$(git rev-parse "$GITHUB_REF^{commit}")" == "$actual_commit" ]]
                    fi

                    {
                        echo "release_commit=$actual_commit"
                        echo "release_tag=$release_tag"
                        echo "release_version=$source_version"
                        echo "source_tree=$source_tree"
                    } >> "$GITHUB_OUTPUT"

            -   name: Install pinned .NET SDKs
                uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
                with:
                    dotnet-version: |
                        10.0.108
                        6.0.428

            -   name: Checkout pinned game reference assemblies
                shell: bash
                run: |
                    set -euo pipefail
                    git init "$RUNNER_TEMP/StardewValley"
                    git -C "$RUNNER_TEMP/StardewValley" fetch --depth 1 https://github.com/StardewModders/mod-reference-assemblies.git "$REFERENCE_ASSEMBLIES_COMMIT"
                    git -C "$RUNNER_TEMP/StardewValley" checkout --detach FETCH_HEAD
                    [[ "$(git -C "$RUNNER_TEMP/StardewValley" rev-parse HEAD)" == "$REFERENCE_ASSEMBLIES_COMMIT" ]]

            -   name: Validate release scripts and formatting
                shell: bash
                run: |
                    set -euo pipefail
                    build/scripts/test-linux-release-inputs.sh
                    build/scripts/test-finalize-install-package-inputs.sh
                    bash -n build/scripts/stage-pinned-github-cli.sh
                    bash -n build/scripts/test-stage-pinned-github-cli.sh
                    bash -n build/scripts/test-pinned-github-cli-callers.sh
                    build/scripts/test-pinned-github-cli-callers.sh
                    bash -n build/scripts/qualify-published-linux-alpha.sh
                    bash -n build/scripts/test-qualify-published-linux-alpha.sh
                    build/scripts/test-qualify-published-linux-alpha.sh
                    python3 build/scripts/test-linux-gui-screenshot-evidence.py
                    python3 build/scripts/test-check-linux-gui-screenshot-evidence.py
                    # CI rechecks generic privacy/path rules with a sentinel. The complete
                    # capture-specific private denylist remains local and is never committed or uploaded.
                    private_strings="$RUNNER_TEMP/linux-gui-screenshot-private-strings.txt"
                    printf '%s\n' 'smapi-evidence-ci-private-sentinel' > "$private_strings"
                    python3 build/scripts/check-linux-gui-screenshot-evidence.py \
                        --private-strings-file "$private_strings"
                    bash -n build/scripts/finalize-install-package.sh
                    bash -n build/scripts/test-packaged-linux-gui.sh
                    bash -n build/scripts/test-packaged-linux-gui-inputs.sh
                    build/scripts/test-packaged-linux-gui-inputs.sh
                    bash -n "src/SMAPI.Installer/assets/install on Linux (graphical).sh"
                    bash -n src/SMAPI.Installer/assets/smapi-runtime-dispatcher.sh
                    bash -n src/SMAPI.Installer/assets/unix-launcher.sh
                    dotnet restore src/SMAPI.slnx \
                        -p:GamePath="$RUNNER_TEMP/StardewValley" \
                        -p:CopyToGameFolder=false \
                        -p:AllowMissingPrunePackageData=true
                    dotnet format whitespace src/SMAPI.slnx --verify-no-changes --no-restore \
                        --include src/SMAPI.Installer.Gui src/SMAPI.Installer.Gui.Tests
                    dotnet format whitespace src/SMAPI.Installer/SMAPI.Installer.csproj --verify-no-changes --no-restore \
                        --include src/SMAPI.Installer/InteractiveInstaller.cs src/SMAPI.Installer/Program.cs
                    git diff --check

            -   name: Build all projects in Release mode
                run: >-
                    dotnet build src/SMAPI.slnx
                    --configuration Release
                    --no-restore
                    -p:GamePath="$RUNNER_TEMP/StardewValley"
                    -p:CopyToGameFolder=false
                    -p:AllowMissingPrunePackageData=true

            -   name: Run fixture-free Linux runtime-dispatcher tests
                run: >-
                    dotnet test src/SMAPI.RuntimeDispatcher.Tests/SMAPI.RuntimeDispatcher.Tests.csproj
                    --configuration Release
                    --no-build
                    -- RunConfiguration.TreatNoTestsAsError=true

            -   name: Run fixture-free analyzer tests
                run: >-
                    dotnet test src/SMAPI.ModBuildConfig.Analyzer.Tests/SMAPI.ModBuildConfig.Analyzer.Tests.csproj
                    --configuration Release
                    --no-build
                    -- RunConfiguration.TreatNoTestsAsError=true

            -   name: Run complete fixture-free installer core tests
                run: >-
                    dotnet test src/SMAPI.Installer.Core.Tests/SMAPI.Installer.Core.Tests.csproj
                    --configuration Release
                    --no-build
                    -- RunConfiguration.TreatNoTestsAsError=true

            -   name: Run fixture-free Linux GUI shell tests
                shell: bash
                run: |
                    set -euo pipefail
                    dotnet test src/SMAPI.Installer.Gui.Tests/SMAPI.Installer.Gui.Tests.csproj \
                        --configuration Release \
                        --no-build \
                        -- RunConfiguration.TreatNoTestsAsError=true
                    build/scripts/test-linux-gui-demo-smoke.sh

            -   name: Run release-asset quartet tests
                run: >-
                    dotnet test src/SMAPI.Installer.PackageTool.Tests/SMAPI.Installer.PackageTool.Tests.csproj
                    --configuration Release
                    --no-build
                    -- RunConfiguration.TreatNoTestsAsError=true

            -   name: Acquire and validate pinned GitHub CLI
                shell: bash
                run: |
                    set -euo pipefail
                    pinned_archive="$RUNNER_TEMP/gh_2.92.0_linux_amd64.tar.gz"
                    pinned_root="$RUNNER_TEMP/pinned-github-cli"
                    curl -fsSL --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
                        https://github.com/cli/cli/releases/download/v2.92.0/gh_2.92.0_linux_amd64.tar.gz \
                        -o "$pinned_archive"
                    build/scripts/test-stage-pinned-github-cli.sh "$pinned_archive"
                    build/scripts/stage-pinned-github-cli.sh "$pinned_archive" "$pinned_root"

            -   name: Build Linux-only installer package
                shell: pwsh
                env:
                    RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
                run: >-
                    ./build/scripts/prepare-install-package.ps1
                    "$env:RELEASE_VERSION"
                    --linux-only
                    "--game-path=$env:RUNNER_TEMP/StardewValley"
                    "--github-cli-directory=$env:RUNNER_TEMP/pinned-github-cli"

            -   name: Test package and generate qualified assets
                shell: bash
                env:
                    RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
                    RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
                    RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
                    SOURCE_TREE: ${{ steps.release.outputs.source_tree }}
                run: |
                    set -euo pipefail
                    package_name="SMAPI-$RELEASE_VERSION-linux-x64-installer.zip"
                    package_path="bin/$package_name"
                    build/scripts/test-linux-release-package.sh "$package_path" "$RELEASE_VERSION"
                    build/scripts/test-packaged-linux-gui-inputs.sh
                    build/scripts/test-packaged-linux-gui.sh "$package_path" "$RELEASE_VERSION"
                    build/scripts/test-linux-installer-lifecycle.sh "$package_path" "$RELEASE_VERSION" "$RUNNER_TEMP/StardewValley"
                    git diff --exit-code

                    if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                        expected_workflow="$GITHUB_REPOSITORY/.github/workflows/linux-alpha-release.yml@refs/tags/$RELEASE_TAG"
                        if [[ "$GITHUB_WORKFLOW_REF" != "$expected_workflow" ]]; then
                            echo "The tag build isn't running from the exact reviewed release workflow ref." >&2
                            exit 1
                        fi
                        dotnet_info_file="$RUNNER_TEMP/linux-alpha-dotnet-info.txt"
                        dotnet --info > "$dotnet_info_file"
                        dotnet run \
                            --project build/SMAPI.Installer.PackageTool/SMAPI.Installer.PackageTool.csproj \
                            --configuration Release \
                            -- \
                            create \
                            --asset-directory artifacts/release \
                            --tag "$RELEASE_TAG" \
                            --source-commit "$RELEASE_COMMIT" \
                            --source-tree "$SOURCE_TREE" \
                            --package "$package_path" \
                            --workflow-ref "$GITHUB_WORKFLOW_REF" \
                            --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
                            --runner-image "$ImageOS-$ImageVersion" \
                            --runner-arch "$RUNNER_ARCH" \
                            --reference-assemblies-commit "$REFERENCE_ASSEMBLIES_COMMIT" \
                            --timestamp-utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                            --dotnet-info-file "$dotnet_info_file"
                    else
                        # Pull requests and pre-tag dispatches remain non-authoritative candidates. Record their
                        # actual workflow ref and don't mint a companion accepted as release authority.
                        dotnet run \
                            --project build/SMAPI.Installer.PackageTool/SMAPI.Installer.PackageTool.csproj \
                            --configuration Release \
                            -- \
                            inspect-candidate \
                            --package "$package_path" \
                            --tag "$RELEASE_TAG"
                        mkdir -p artifacts/release
                        cp -- "$package_path" artifacts/release/
                        (
                            cd artifacts/release
                            sha256sum -- "$package_name" > SHA256SUMS
                        )
                        package_sha256="$(cut -d ' ' -f 1 artifacts/release/SHA256SUMS)"
                        package_size="$(stat -c %s "$package_path")"
                        dotnet_info="$(dotnet --info)"

                        jq -n \
                            --arg schema_version "1" \
                            --arg release_version "$RELEASE_VERSION" \
                            --arg release_tag "$RELEASE_TAG" \
                            --arg source_repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                            --arg source_commit "$RELEASE_COMMIT" \
                            --arg source_tree "$SOURCE_TREE" \
                            --arg workflow "$GITHUB_WORKFLOW_REF" \
                            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
                            --arg runner_image "$ImageOS-$ImageVersion" \
                            --arg runner_arch "$RUNNER_ARCH" \
                            --arg reference_assemblies_commit "$REFERENCE_ASSEMBLIES_COMMIT" \
                            --arg package "$package_name" \
                            --arg package_sha256 "$package_sha256" \
                            --argjson package_size "$package_size" \
                            --arg build_configuration "Release" \
                            --arg runtime_identifier "linux-x64" \
                            --arg build_timestamp_utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                            --arg dotnet_info "$dotnet_info" \
                            '{
                                schema_version: ($schema_version | tonumber),
                                release: {version: $release_version, tag: $release_tag},
                                source: {repository: $source_repository, commit: $source_commit, tree: $source_tree},
                                build: {
                                    workflow: $workflow,
                                    run: $workflow_run,
                                    runner_image: $runner_image,
                                    runner_arch: $runner_arch,
                                    reference_assemblies_commit: $reference_assemblies_commit,
                                    configuration: $build_configuration,
                                    runtime_identifier: $runtime_identifier,
                                    timestamp_utc: $build_timestamp_utc,
                                    dotnet_info: $dotnet_info
                                },
                                artifact: {name: $package, size_bytes: $package_size, sha256: $package_sha256},
                                reproducibility: "Inputs and provenance are recorded; byte-for-byte reproducibility is not claimed."
                            }' > artifacts/release/build-metadata.json
                        jq -e . artifacts/release/build-metadata.json >/dev/null
                        (cd artifacts/release && sha256sum --check --strict SHA256SUMS)
                    fi

            -   name: Upload qualified release assets
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
                with:
                    name: linux-alpha-release-${{ steps.release.outputs.release_commit }}
                    path: artifacts/release
                    if-no-files-found: error
                    retention-days: 30
                    compression-level: 0

    attest:
        name: Attest Linux alpha package
        if: github.event_name != 'pull_request'
        needs: qualify-and-package
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write
            attestations: write
            artifact-metadata: write
        steps:
            -   name: Download qualified release assets
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
                with:
                    name: linux-alpha-release-${{ needs.qualify-and-package.outputs.release_commit }}
                    path: artifacts/release

            -   name: Checkout exact release source
                if: github.event_name == 'push'
                uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
                with:
                    persist-credentials: false
                    ref: ${{ needs.qualify-and-package.outputs.release_commit }}
                    path: source

            -   name: Install pinned .NET SDKs
                if: github.event_name == 'push'
                uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
                with:
                    dotnet-version: |
                        10.0.108
                        6.0.428

            -   name: Verify downloaded release assets
                shell: bash
                env:
                    RELEASE_COMMIT: ${{ needs.qualify-and-package.outputs.release_commit }}
                    RELEASE_TAG: ${{ needs.qualify-and-package.outputs.release_tag }}
                    SOURCE_TREE: ${{ needs.qualify-and-package.outputs.source_tree }}
                run: |
                    set -euo pipefail
                    if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                        dotnet run \
                            --project source/build/SMAPI.Installer.PackageTool/SMAPI.Installer.PackageTool.csproj \
                            --configuration Release \
                            -- \
                            verify-release \
                            --asset-directory artifacts/release \
                            --tag "$RELEASE_TAG" \
                            --source-commit "$RELEASE_COMMIT" \
                            --source-tree "$SOURCE_TREE"
                    else
                        (cd artifacts/release && sha256sum --check --strict SHA256SUMS)
                    fi

            -   name: Attest every checksummed release subject
                id: attestation
                uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
                with:
                    subject-checksums: artifacts/release/SHA256SUMS

            -   name: Prepare separately checksummed local provenance pair
                shell: bash
                env:
                    BUNDLE_SOURCE: ${{ steps.attestation.outputs.bundle-path }}
                    RELEASE_VERSION: ${{ needs.qualify-and-package.outputs.release_version }}
                run: |
                    set -euo pipefail
                    bundle_name="SMAPI-$RELEASE_VERSION-linux-x64-attestation-bundle.jsonl"
                    checksum_name="$bundle_name.sha256"
                    bundle_path="artifacts/provenance/$bundle_name"
                    checksum_path="artifacts/provenance/$checksum_name"

                    if [[ -z "$BUNDLE_SOURCE" || ! -f "$BUNDLE_SOURCE" || -L "$BUNDLE_SOURCE" ]]; then
                        echo "The attestation action didn't produce one ordinary local-verification bundle." >&2
                        exit 1
                    fi
                    mkdir -p artifacts/provenance
                    cp -- "$BUNDLE_SOURCE" "$bundle_path"
                    bundle_size="$(stat -c %s -- "$bundle_path")"
                    if (( bundle_size <= 0 || bundle_size > 2097152 )); then
                        echo "The local attestation bundle is empty or exceeds 2 MiB." >&2
                        exit 1
                    fi
                    jq -e -s '
                        length == 1
                        and (.[0]
                            | type == "object"
                            and keys == ["dsseEnvelope", "mediaType", "verificationMaterial"]
                            and .mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json"
                            and (.verificationMaterial | type) == "object"
                            and (.dsseEnvelope | type) == "object")
                    ' "$bundle_path" >/dev/null
                    (
                        cd artifacts/provenance
                        sha256sum -- "$bundle_name" > "$checksum_name"
                    )
                    checksum_size="$(stat -c %s -- "$checksum_path")"
                    if (( checksum_size <= 0 || checksum_size > 1024 )); then
                        echo "The local attestation checksum is empty or exceeds 1024 bytes." >&2
                        exit 1
                    fi
                    if [[ "$(find artifacts/provenance -mindepth 1 -maxdepth 1 -printf . | wc -c)" != 2 \
                        || ! -f "$bundle_path" || -L "$bundle_path" || "$(stat -c %h -- "$bundle_path")" != 1 \
                        || ! -f "$checksum_path" || -L "$checksum_path" || "$(stat -c %h -- "$checksum_path")" != 1 ]]; then
                        echo "The local provenance artifact must contain exactly two single-link ordinary files." >&2
                        exit 1
                    fi
                    expected_checksum="$RUNNER_TEMP/expected-attestation-bundle.sha256"
                    printf '%s  %s\n' "$(sha256sum -- "$bundle_path" | cut -d ' ' -f 1)" "$bundle_name" > "$expected_checksum"
                    cmp --silent "$expected_checksum" "$checksum_path"
                    (cd artifacts/provenance && sha256sum --check --strict "$checksum_name")

            -   name: Verify local bundle with the pinned release policy
                if: github.event_name == 'push'
                shell: bash
                env:
                    RELEASE_COMMIT: ${{ needs.qualify-and-package.outputs.release_commit }}
                    RELEASE_TAG: ${{ needs.qualify-and-package.outputs.release_tag }}
                    RELEASE_VERSION: ${{ needs.qualify-and-package.outputs.release_version }}
                run: |
                    set -euo pipefail
                    package_name="SMAPI-$RELEASE_VERSION-linux-x64-installer.zip"
                    manifest_name="SMAPI-$RELEASE_VERSION-linux-x64-install-manifest.json"
                    bundle_name="SMAPI-$RELEASE_VERSION-linux-x64-attestation-bundle.jsonl"
                    package_sha256="$(awk -v name="$package_name" '$2 == name { print $1 }' artifacts/release/SHA256SUMS)"
                    manifest_sha256="$(awk -v name="$manifest_name" '$2 == name { print $1 }' artifacts/release/SHA256SUMS)"
                    if [[ ! "$package_sha256" =~ ^[0-9a-f]{64}$ || ! "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]; then
                        echo "The qualified checksums don't contain the exact two attestation subjects." >&2
                        exit 1
                    fi

                    pinned_root="$RUNNER_TEMP/pinned-gh-2.92.0"
                    pinned_archive="$RUNNER_TEMP/gh_2.92.0_linux_amd64.tar.gz"
                    private_home="$RUNNER_TEMP/pinned-gh-private"
                    verification="$RUNNER_TEMP/local-bundle-verification.json"
                    install -d -m 0700 -- "$private_home"
                    curl -fsSL --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
                        https://github.com/cli/cli/releases/download/v2.92.0/gh_2.92.0_linux_amd64.tar.gz \
                        -o "$pinned_archive"
                    source/build/scripts/stage-pinned-github-cli.sh "$pinned_archive" "$pinned_root"
                    pinned_gh="$pinned_root/gh"

                    package_path="$(realpath -- "artifacts/release/$package_name")"
                    bundle_path="$(realpath -- "artifacts/provenance/$bundle_name")"
                    env -i \
                        HOME="$private_home" \
                        GH_CONFIG_DIR="$private_home" \
                        XDG_CONFIG_HOME="$private_home" \
                        XDG_CACHE_HOME="$private_home" \
                        XDG_RUNTIME_DIR="$private_home" \
                        TMPDIR="$private_home" \
                        DBUS_SESSION_BUS_ADDRESS="unix:path=$private_home/session-bus-unavailable" \
                        DBUS_SYSTEM_BUS_ADDRESS="unix:path=$private_home/system-bus-unavailable" \
                        GH_PROMPT_DISABLED=1 \
                        GH_NO_UPDATE_NOTIFIER=1 \
                        GH_NO_EXTENSION_UPDATE_NOTIFIER=1 \
                        GH_PAGER= \
                        PAGER= \
                        NO_COLOR=1 \
                        TERM=dumb \
                        LANG=C.UTF-8 \
                        LC_ALL=C.UTF-8 \
                        "$pinned_gh" attestation verify "$package_path" \
                            --bundle "$bundle_path" \
                            --hostname github.com \
                            --repo "$GITHUB_REPOSITORY" \
                            --predicate-type https://slsa.dev/provenance/v1 \
                            --cert-oidc-issuer https://token.actions.githubusercontent.com \
                            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/linux-alpha-release.yml@refs/tags/$RELEASE_TAG" \
                            --signer-digest "$RELEASE_COMMIT" \
                            --source-ref "refs/tags/$RELEASE_TAG" \
                            --source-digest "$RELEASE_COMMIT" \
                            --deny-self-hosted-runners \
                            --limit 2 \
                            --format json \
                            > "$verification"
                    verification_size="$(stat -c %s -- "$verification")"
                    if (( verification_size <= 0 || verification_size > 2097152 )); then
                        echo "The pinned local-bundle verifier returned an invalid amount of evidence." >&2
                        exit 1
                    fi
                    jq -e \
                        --arg manifest_name "$manifest_name" \
                        --arg manifest_sha256 "$manifest_sha256" \
                        --arg package_name "$package_name" \
                        --arg package_sha256 "$package_sha256" \
                        '
                            type == "array"
                            and length == 1
                            and .[0].verificationResult.statement.subject == [
                                {"name": $manifest_name, "digest": {"sha256": $manifest_sha256}},
                                {"name": $package_name, "digest": {"sha256": $package_sha256}}
                            ]
                        ' "$verification" >/dev/null

            -   name: Upload local provenance pair separately
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
                with:
                    name: linux-alpha-provenance-${{ needs.qualify-and-package.outputs.release_commit }}
                    path: artifacts/provenance
                    if-no-files-found: error
                    retention-days: 30
                    compression-level: 0

    publish-prerelease:
        name: Publish experimental GitHub prerelease
        if: github.event_name == 'push'
        needs:
            - qualify-and-package
            - attest
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: write
        steps:
            -   name: Download qualified release assets
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
                with:
                    name: linux-alpha-release-${{ needs.qualify-and-package.outputs.release_commit }}
                    path: artifacts/release

            -   name: Download local provenance pair
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
                with:
                    name: linux-alpha-provenance-${{ needs.qualify-and-package.outputs.release_commit }}
                    path: artifacts/provenance

            -   name: Checkout exact release source
                uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
                with:
                    persist-credentials: false
                    ref: ${{ needs.qualify-and-package.outputs.release_commit }}
                    path: source

            -   name: Install pinned .NET SDKs
                uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
                with:
                    dotnet-version: |
                        10.0.108
                        6.0.428

            -   name: Verify downloaded release assets
                shell: bash
                env:
                    RELEASE_COMMIT: ${{ needs.qualify-and-package.outputs.release_commit }}
                    RELEASE_TAG: ${{ needs.qualify-and-package.outputs.release_tag }}
                    RELEASE_VERSION: ${{ needs.qualify-and-package.outputs.release_version }}
                    SOURCE_TREE: ${{ needs.qualify-and-package.outputs.source_tree }}
                run: |
                    set -euo pipefail
                    dotnet run \
                        --project source/build/SMAPI.Installer.PackageTool/SMAPI.Installer.PackageTool.csproj \
                        --configuration Release \
                        -- \
                        verify-release \
                        --asset-directory artifacts/release \
                        --tag "$RELEASE_TAG" \
                        --source-commit "$RELEASE_COMMIT" \
                        --source-tree "$SOURCE_TREE"

                    bundle_name="SMAPI-$RELEASE_VERSION-linux-x64-attestation-bundle.jsonl"
                    checksum_name="$bundle_name.sha256"
                    bundle_path="artifacts/provenance/$bundle_name"
                    checksum_path="artifacts/provenance/$checksum_name"
                    if [[ "$(find artifacts/provenance -mindepth 1 -maxdepth 1 -printf . | wc -c)" != 2 \
                        || ! -f "$bundle_path" || -L "$bundle_path" || "$(stat -c %h -- "$bundle_path")" != 1 \
                        || ! -f "$checksum_path" || -L "$checksum_path" || "$(stat -c %h -- "$checksum_path")" != 1 ]]; then
                        echo "The downloaded local provenance pair has unexpected entries or file types." >&2
                        exit 1
                    fi
                    bundle_size="$(stat -c %s -- "$bundle_path")"
                    checksum_size="$(stat -c %s -- "$checksum_path")"
                    if (( bundle_size <= 0 || bundle_size > 2097152 || checksum_size <= 0 || checksum_size > 1024 )); then
                        echo "The downloaded local provenance pair violates its size bounds." >&2
                        exit 1
                    fi
                    jq -e -s '
                        length == 1
                        and (.[0]
                            | type == "object"
                            and keys == ["dsseEnvelope", "mediaType", "verificationMaterial"]
                            and .mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json"
                            and (.verificationMaterial | type) == "object"
                            and (.dsseEnvelope | type) == "object")
                    ' "$bundle_path" >/dev/null
                    expected_checksum="$RUNNER_TEMP/expected-attestation-bundle.sha256"
                    printf '%s  %s\n' "$(sha256sum -- "$bundle_path" | cut -d ' ' -f 1)" "$bundle_name" > "$expected_checksum"
                    cmp --silent "$expected_checksum" "$checksum_path"
                    (cd artifacts/provenance && sha256sum --check --strict "$checksum_name")

            -   name: Publish immutable-identity prerelease
                shell: bash
                env:
                    GH_TOKEN: ${{ github.token }}
                    RELEASE_COMMIT: ${{ needs.qualify-and-package.outputs.release_commit }}
                    RELEASE_TAG: ${{ needs.qualify-and-package.outputs.release_tag }}
                    RELEASE_VERSION: ${{ needs.qualify-and-package.outputs.release_version }}
                run: |
                    set -euo pipefail
                    if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                        echo "Release '$RELEASE_TAG' already exists; refusing to replace it." >&2
                        exit 1
                    fi

                    package_name="SMAPI-$RELEASE_VERSION-linux-x64-installer.zip"
                    manifest_name="SMAPI-$RELEASE_VERSION-linux-x64-install-manifest.json"
                    bundle_name="SMAPI-$RELEASE_VERSION-linux-x64-attestation-bundle.jsonl"
                    bundle_checksum_name="$bundle_name.sha256"
                    package_sha256="$(awk -v name="$package_name" '$2 == name { print $1 }' artifacts/release/SHA256SUMS)"
                    manifest_sha256="$(awk -v name="$manifest_name" '$2 == name { print $1 }' artifacts/release/SHA256SUMS)"
                    bundle_sha256="$(awk -v name="$bundle_name" '$2 == name { print $1 }' "artifacts/provenance/$bundle_checksum_name")"
                    if [[ ! "$package_sha256" =~ ^[0-9a-f]{64}$ || ! "$manifest_sha256" =~ ^[0-9a-f]{64}$ || ! "$bundle_sha256" =~ ^[0-9a-f]{64}$ ]]; then
                        echo "The verified checksums don't contain the exactly named release subjects and local provenance bundle." >&2
                        exit 1
                    fi
                    if [[ ! "$RELEASE_TAG" =~ ^fork-4eh5xitv6787h645ebv-linux-v([0-9]+\.[0-9]+\.[0-9]+)-alpha\.([1-9][0-9]*)$ ]]; then
                        echo "The validated release tag has an unexpected format: $RELEASE_TAG" >&2
                        exit 1
                    fi
                    release_title="Experimental SMAPI Linux Fork ${BASH_REMATCH[1]} alpha ${BASH_REMATCH[2]}"
                    notes="$RUNNER_TEMP/release-notes.md"
                    {
                        echo "# Experimental unofficial Linux desktop alpha"
                        echo
                        echo "This is an **unofficial experimental fork**, not an official SMAPI release. It supports native Linux x86_64 and Stardew Valley 1.6.14 or later. Normal installation must run as the desktop user, never with sudo or as root."
                        echo
                        echo "Exact source commit: \`$RELEASE_COMMIT\`  "
                        echo "Embedded version: \`$RELEASE_VERSION\`  "
                        echo "Official base: SMAPI 4.5.2"
                        echo
                        echo "## Download integrity"
                        echo
                        echo "\`$package_sha256  $package_name\`"
                        echo "\`$manifest_sha256  $manifest_name\`"
                        echo "\`$bundle_sha256  $bundle_name\`"
                        echo
                        echo "Download all six assets into one empty directory. Check the package and manifest bytes with \`sha256sum --check --strict SHA256SUMS\`, then inspect \`build-metadata.json\` and confirm its exact release/source/artifact fields agree. Check the separately published local bundle with \`sha256sum --check --strict '$bundle_checksum_name'\`; that sidecar provides transport-integrity detection, while the signed attestation and strict verification policy establish authenticity. With GitHub CLI 2.92.0, verify both downloaded checksum subjects from that same bundle without a GitHub login or authenticated attestation download. Run \`gh attestation verify '$package_name' --bundle '$bundle_name' --hostname github.com --repo '$GITHUB_REPOSITORY' --predicate-type https://slsa.dev/provenance/v1 --cert-oidc-issuer https://token.actions.githubusercontent.com --cert-identity 'https://github.com/$GITHUB_REPOSITORY/.github/workflows/linux-alpha-release.yml@refs/tags/$RELEASE_TAG' --signer-digest '$RELEASE_COMMIT' --source-ref 'refs/tags/$RELEASE_TAG' --source-digest '$RELEASE_COMMIT' --deny-self-hosted-runners --limit 2 --format json\`, then run the identical command with \`'$manifest_name'\` as the artifact path. GitHub CLI may still retrieve Sigstore/GitHub trusted-root metadata unless it is already cached. Both commands must succeed; the successful statement must contain exactly the installer ZIP and install-manifest names and locally computed digests."
                        echo
                        echo "## Install, upgrade, and rollback"
                        echo
                        echo "Close the game, back up saves and Mods, verify all six release files, and extract the installer ZIP. In an X11 or XWayland desktop session run \`install on Linux (graphical).sh\`; the terminal fallback from the same package is \`install on Linux.sh\`. The GUI can acquire a reviewed public release or verify a freshly selected local folder containing the exact six files, then shows a read-only plan before any game file changes. After receipt inspection, use **Update** to change an authenticated managed installation to the verified target, including an explicitly confirmed downgrade; use **Repair** only when the authenticated current and target release match. Use **Roll back** only for an authenticated recovery generation the GUI lists. To leave this fork for an older package or official SMAPI 4.5.2, use **Uninstall** first, verify the older package independently, and then install it. See the [Linux alpha guide](https://4eh5xitv6787h645ebv.github.io/SMAPI/technical/linux-alpha-release.html)."
                        echo
                        echo "## Known limitations"
                        echo
                        echo "The graphical installer is experimental. Its supported desktop path is X11 or XWayland; the experimental native Wayland backend is not advertised as supported. The local-folder route accepts only one user-owned folder containing the exact six files and requires a fresh selection for every attempt; it never treats the folder path or metadata as verified identity. GitHub CLI may need network access to refresh Sigstore/GitHub trusted-root metadata even though the release bundle itself is downloaded and verified locally. Same-user adversarial process or path replacement remains outside the nonprivileged launcher boundary. A bounded private local log and restricted sanitized viewer are available on every production screen. Performance and Mod Health reports can contain mod and system identifiers; the graphical viewer/copy text deliberately excludes paths, URLs, raw backend prose, private workload names, release/package identifiers, and digests. All diagnostics stay local unless you explicitly copy or share them."
                        echo
                        echo "See the [comparison](https://4eh5xitv6787h645ebv.github.io/SMAPI/upstream-comparison.html), [validation record](https://4eh5xitv6787h645ebv.github.io/SMAPI/technical/linux-alpha-release-validation.html), [documentation](https://4eh5xitv6787h645ebv.github.io/SMAPI/), and [fork issue tracker](https://github.com/$GITHUB_REPOSITORY/issues)."
                    } > "$notes"

                    gh release create "$RELEASE_TAG" \
                        "artifacts/release/$package_name" \
                        "artifacts/release/$manifest_name" \
                        artifacts/release/SHA256SUMS \
                        artifacts/release/build-metadata.json \
                        "artifacts/provenance/$bundle_name" \
                        "artifacts/provenance/$bundle_checksum_name" \
                        --repo "$GITHUB_REPOSITORY" \
                        --verify-tag \
                        --target "$RELEASE_COMMIT" \
                        --title "$release_title" \
                        --notes-file "$notes" \
                        --prerelease
