name: Build SMAPI

on:
    push:
        branches:
            - develop
            - build-test

concurrency:
    group: build-smapi-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build Linux installer
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            -   name: Checkout code
                uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
                with:
                    persist-credentials: false

            -   name: Install pinned .NET SDKs
                uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
                with:
                    dotnet-version: |
                        10.0.108
                        6.0.428

            -   name: Read committed SMAPI version
                id: version
                shell: bash
                run: |
                    set -euo pipefail
                    version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' build/common.targets)"
                    if [[ -z "$version" ]]; then
                        echo "Couldn't read the committed version." >&2
                        exit 1
                    fi
                    echo "version=$version" >> "$GITHUB_OUTPUT"

            -   name: Checkout pinned game reference assemblies
                shell: bash
                env:
                    REFERENCE_ASSEMBLIES_COMMIT: 0141355fecb8536715ecff22f99374b5e632cbed
                run: |
                    set -euo pipefail
                    git init "$RUNNER_TEMP/StardewValley"
                    git -C "$RUNNER_TEMP/StardewValley" fetch --depth 1 https://github.com/StardewModders/mod-reference-assemblies.git "$REFERENCE_ASSEMBLIES_COMMIT"
                    git -C "$RUNNER_TEMP/StardewValley" checkout --detach FETCH_HEAD
                    [[ "$(git -C "$RUNNER_TEMP/StardewValley" rev-parse HEAD)" == "$REFERENCE_ASSEMBLIES_COMMIT" ]]

            -   name: Build Linux installer
                shell: pwsh
                env:
                    VERSION: ${{ steps.version.outputs.version }}
                run: >-
                    ./build/scripts/prepare-install-package.ps1
                    "$env:VERSION"
                    --linux-only
                    "--game-path=$env:RUNNER_TEMP/StardewValley"

            -   name: Validate Linux installer
                shell: bash
                env:
                    VERSION: ${{ steps.version.outputs.version }}
                run: |
                    set -euo pipefail
                    build/scripts/test-linux-release-package.sh \
                        "bin/SMAPI-$VERSION-linux-x64-installer.zip" \
                        "$VERSION"
                    build/scripts/test-linux-installer-lifecycle.sh \
                        "bin/SMAPI-$VERSION-linux-x64-installer.zip" \
                        "$VERSION" \
                        "$RUNNER_TEMP/StardewValley"
                    git diff --exit-code

            -   name: Upload Linux installer
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
                with:
                    name: linux-installer-${{ github.sha }}
                    path: bin/SMAPI-${{ steps.version.outputs.version }}-linux-x64-installer.zip
                    if-no-files-found: error
                    retention-days: 14
                    compression-level: 0
